<title>Painel de Prospecção de Revendas Starlink — Bradel</title>
<style>
  :root{
    color-scheme: light;
    --plane:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb;
    --ink:#0e1726; --ink-2:#51607a; --muted:#8a96ab;
    --grid:#e4e8ef; --axis:#cfd6e2; --line:rgba(14,23,38,.10); --line-2:rgba(14,23,38,.06);
    --accent:#2a78d6; --accent-ink:#1c5cab; --accent-wash:#e7f0fb;
    --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --serious:#ec835a; --crit:#d03b3b;
    --s1:#2a78d6; --s2:#008300; --s3:#e87ba4; --s4:#eda100; --s5:#1baf7a; --s6:#eb6834;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(14,23,38,.06),0 8px 24px -16px rgba(14,23,38,.28);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --plane:#0a0f1c; --surface:#121a2b; --surface-2:#0e1524;
      --ink:#f2f5fa; --ink-2:#aeb9cc; --muted:#7e8ba3;
      --grid:#26314a; --axis:#39455f; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.055);
      --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:#13233c;
      --good:#0ca30c; --good-ink:#2ec62e; --warn:#fab219; --warn-ink:#f6c45a; --serious:#ec835a; --crit:#e05a5a;
      --s1:#3987e5; --s2:#008300; --s3:#d55181; --s4:#c98500; --s5:#199e70; --s6:#d95926;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0a0f1c; --surface:#121a2b; --surface-2:#0e1524;
    --ink:#f2f5fa; --ink-2:#aeb9cc; --muted:#7e8ba3;
    --grid:#26314a; --axis:#39455f; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.055);
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:#13233c;
    --good:#0ca30c; --good-ink:#2ec62e; --warn:#fab219; --warn-ink:#f6c45a; --serious:#ec835a; --crit:#e05a5a;
    --s1:#3987e5; --s2:#008300; --s3:#d55181; --s4:#c98500; --s5:#199e70; --s6:#d95926;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--font);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
  .tnum{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}

  /* layout shell */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  .rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:2px;padding:16px 12px;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
  .brand .dish{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent),var(--accent-ink));color:#fff;flex:none}
  .brand b{font-size:14.5px;letter-spacing:-.01em;display:block}
  .brand span{font-size:11px;color:var(--muted)}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;
    background:transparent;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:550}
  .nav button svg{width:18px;height:18px;flex:none;opacity:.85}
  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button[aria-current="true"]{background:var(--accent-wash);color:var(--accent-ink)}
  .nav button[aria-current="true"] svg{opacity:1}
  .rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px}
  .rail .foot small{color:var(--muted);font-size:10.5px;line-height:1.4}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;background:color-mix(in srgb,var(--plane) 86%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 26px;z-index:4;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar h1{font-size:18px}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-left:2px}
  .spacer{flex:1}
  .content{padding:22px 26px 60px;max-width:1280px;width:100%}

  /* controls */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
    padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink);transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
  .iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);cursor:pointer;color:var(--ink-2)}
  .iconbtn:hover{color:var(--accent-ink);border-color:var(--accent)}
  select,input[type=text],input[type=number],input[type=date],input[type=email],textarea{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);font-weight:600}
  label.fld .req{color:var(--crit)}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
  .filters .fld{min-width:150px;flex:0 1 auto}
  .filters .grow{flex:1 1 200px}

  /* cards & tiles */
  .grid{display:grid;gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .hd{padding:15px 17px 0;display:flex;align-items:baseline;gap:10px;justify-content:space-between}
  .card .hd h3{font-size:14px}
  .card .bd{padding:14px 17px 17px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .tile .lab{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .tile .val{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:7px;line-height:1}
  .tile .ctx{font-size:12px;color:var(--ink-2);margin-top:8px;display:flex;align-items:center;gap:6px}
  .tile .bar{height:7px;border-radius:99px;background:var(--surface-2);margin-top:11px;overflow:hidden}
  .tile .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
  .tile.good .bar i{background:var(--good)} .tile.good .val{color:var(--good-ink)}

  /* pills */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;
    border:1px solid transparent;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:99px;background:currentColor;opacity:.85}
  .pill.credenciada{color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .pill.em{color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 20%,transparent)}
  .pill.sem{color:var(--ink-2);background:var(--surface-2)}
  .pill.ativa{color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .pill.alvo-v{color:#fff;background:var(--crit);border-color:transparent}
  .pill.alvo-a{color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 26%,transparent)}
  .pill.cob-credenciada{color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .pill.cob-semviv{color:var(--accent-ink);background:var(--accent-wash)}
  .pill.cob-prospeccao{color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 20%,transparent)}
  .pill.cob-sem{color:var(--ink-2);background:var(--surface-2)}

  /* tables */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);font-weight:650;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line);z-index:1}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.row-alvo-v{box-shadow:inset 3px 0 0 var(--crit)}
  tr.row-alvo-a{box-shadow:inset 3px 0 0 var(--warn)}
  .rowbtn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:3px;border-radius:6px}
  .rowbtn:hover{color:var(--accent-ink);background:var(--accent-wash)}
  .nomcell b{font-weight:600}.nomcell small{display:block;color:var(--muted);font-size:11px}

  /* charts */
  .chart{width:100%}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend span i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .tooltip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;
    font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .08s;z-index:50;max-width:240px}
  .tooltip b{color:var(--surface)}
  .tooltip .tt-row{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tooltip .tt-row i{width:9px;height:9px;border-radius:2px}

  .barrow{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;padding:5px 0}
  .barrow .lab{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
  .barrow .track{height:22px;border-radius:7px;background:var(--surface-2);position:relative;overflow:hidden}
  .barrow .track i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;min-width:2px}
  .barrow .amt{font-variant-numeric:tabular-nums;font-weight:650;font-size:13px;min-width:34px;text-align:right}

  .funnel .barrow{grid-template-columns:168px 1fr auto}
  .funnel .track i{background:var(--accent)}
  .convrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;padding:2px 0 2px 168px}
  .convrow b{color:var(--ink-2)}

  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cmp .box{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;background:var(--surface-2)}
  .cmp .box .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:7px}
  .cmp .box .k i{width:10px;height:10px;border-radius:3px}
  .cmp .box .v{font-size:23px;font-weight:700;margin-top:6px}
  .cmp .box .d{font-size:12px;color:var(--ink-2);margin-top:3px}

  .note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);
    border-radius:var(--radius-sm);padding:11px 13px;display:flex;gap:9px}
  .note svg{width:16px;height:16px;flex:none;color:var(--accent);margin-top:1px}

  .sectitle{display:flex;align-items:baseline;gap:10px;margin:4px 0 12px}
  .sectitle h2{font-size:15px}.sectitle p{color:var(--muted);font-size:12.5px;margin:0}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(10,15,28,.55);backdrop-filter:blur(2px);z-index:40;display:none;
    align-items:flex-start;justify-content:center;padding:34px 16px;overflow:auto}
  .scrim.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    width:min(760px,100%);max-height:none}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal .mh h3{font-size:15px}
  .modal .mb{padding:18px 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
  .modal .mb .full{grid-column:1/-1}
  .modal .mb .sub{grid-column:1/-1;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    font-weight:650;border-top:1px dashed var(--line);padding-top:12px;margin-top:3px}
  .modal .mf{display:flex;gap:10px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);
    padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:.2s;z-index:60;font-weight:600;font-size:13px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{padding:36px;text-align:center;color:var(--muted)}
  .hint{color:var(--muted);font-size:12px}
  .kgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1000px){ .kgrid{grid-template-columns:1fr} .cmp{grid-template-columns:1fr} }

  /* responsive rail -> top */
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
    .brand{padding:4px 8px 4px 2px}.brand span{display:none}
    .nav{flex-direction:row;margin:0}
    .nav button span{display:none}.nav button{padding:9px}
    .rail .foot{display:none}
    .content{padding:18px 16px 60px}.topbar{padding:12px 16px}
    .modal .mb{grid-template-columns:1fr}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>

<script>

/* ---- seed: 8 revendas de EXEMPLO ----------------------------------------- */

}
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const s=JSON.parse(raw); return Object.assign(defaults(), s); } }
  catch(e){ console.warn("load falhou",e); }
  return defaults();
}

/* ============================ UTILIDADES ================================== */
function today(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function parseD(s){ if(!s) return null; const p=String(s).split("-"); if(p.length!==3) return null; return new Date(+p[0],+p[1]-1,+p[2]); }
function daysBetween(a,b){ return Math.round((a-b)/86400000); }
function fmtD(s){ const d=parseD(s); if(!d) return "—"; const p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`; }
function fmtPct(x){ if(x==null||isNaN(x)) return "—"; return (x*100).toFixed(1).replace(".",",")+"%"; }
function fmtNum(x){ if(x==null||isNaN(x)) return "—"; return Number(x).toLocaleString("pt-BR"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* ============================ DERIVAÇÕES ================================== */
function mercadoBy(mun,uf){ return state.mercado.find(m=>m.municipio===mun && m.uf===uf) || null; }
function vendas3m(m){ return (+m.vendasJun||0)+(+m.vendasJul||0)+(+m.vendasAgo||0); }
function regiaoOf(mun,uf){ const m=mercadoBy(mun,uf); return m? m.regiao : null; }
function prioridadeOf(mun,uf){ const m=mercadoBy(mun,uf); return m? m.prioridade : null; }
function respOf(r){
  if(r.respOverride) return r.respOverride;
  const t=state.territorios.find(t=>t.municipio===r.municipio && t.uf===r.uf);
  return t? t.resp : "(sem território)";
}
function etapaDateOf(r){
  const f=ETAPA_DATE[r.etapa];
  if(r.etapa==="Revenda ativa") return parseD(r.dataUltimaVenda) || parseD(r.data1Venda);
  return f? parseD(r[f]) : null;
}
function diasNaEtapa(r){ const d=etapaDateOf(r); if(!d||!r.etapa) return null; return daysBetween(today(),d); }
function isAtiva(r){ const d=parseD(r.dataUltimaVenda); if(!d) return false; return daysBetween(today(),d) <= (+state.params.diasAtiva||60); }
function isCred(r){ return r.statusVivensis==="Credenciada"; }
function isPerdida(r){ return r.etapa==="Perdida/Descartada"; }
function alertaOf(r){
  if(isPerdida(r)) return null;
  const d=diasNaEtapa(r); if(d==null) return null;
  if(d > (+state.params.vermelho||60)) return "v";
  if(d > (+state.params.amarelo||30)) return "a";
  return null;
}
function etapaIdx(et){ const i=ETAPAS.indexOf(et); return i<0? null : i+1; } // 1..8

/* cobertura por município */
function cobertura(ufFilter){
  return state.mercado.filter(m=>m.municipio).filter(m=>!ufFilter||ufFilter==="Todos"||m.uf===ufFilter).map(m=>{
    const revs=state.revendas.filter(r=>r.municipio===m.municipio && r.uf===m.uf);
    const prospeccao=revs.filter(r=>!isPerdida(r)).length;
    const ativas=revs.filter(isAtiva).length;
    const ativasSemViv=revs.filter(r=>isAtiva(r)&&!isCred(r)).length;
    const credenciadas=revs.filter(isCred).length;
    const credAtivas=revs.filter(r=>isAtiva(r)&&isCred(r)).length;
    let situacao = credenciadas>0?"Revenda credenciada": ativasSemViv>0?"Revenda sem Vivensis": prospeccao>0?"Em prospecção":"Sem revenda";
    return {...m, vendas:vendas3m(m), prospeccao, ativas, ativasSemViv, credenciadas,
      temAtiva:ativas>0, temCredAtiva:credAtivas>0, situacao};
  });
}
function kpisCobertura(ufFilter){
  const cob=cobertura(ufFilter).filter(c=>c.prioridade===1);
  const denom=cob.reduce((s,c)=>s+c.vendas,0);
  const numA=cob.filter(c=>c.temAtiva).reduce((s,c)=>s+c.vendas,0);
  const numC=cob.filter(c=>c.temCredAtiva).reduce((s,c)=>s+c.vendas,0);
  return { cobP1: denom? numA/denom : 0, cobP1cred: denom? numC/denom : 0, denom, numA, numC };
}

/* filtro genérico de revendas */
function filtra(revs, f){
  return revs.filter(r=>{
    if(f.uf && f.uf!=="Todos" && r.uf!==f.uf) return false;
    if(f.resp && f.resp!=="Todos" && respOf(r)!==f.resp) return false;
    if(f.etapa && f.etapa!=="Todas" && r.etapa!==f.etapa) return false;
    if(f.status && f.status!=="Todos" && r.statusVivensis!==f.status) return false;
    if(f.canal && f.canal!=="Todos" && r.canal!==f.canal) return false;
    if(f.q){ const q=f.q.toLowerCase(); const hay=[r.nome,r.municipio,r.contato,r.cnpj,respOf(r)].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

/* funil */
function funil(revs){
  const mat={}; ETAPAS.forEach(et=>{ mat[et]={}; STATUS_VIV.forEach(s=>mat[et][s]=0); mat[et].total=0; });
  revs.forEach(r=>{ if(mat[r.etapa]){ mat[r.etapa][r.statusVivensis]=(mat[r.etapa][r.statusVivensis]||0)+1; mat[r.etapa].total++; } });
  // atingiram etapa k (1..7), exclui perdida
  const reached={}; for(let k=1;k<=7;k++){ reached[k]={total:0}; STATUS_VIV.forEach(s=>reached[k][s]=0); }
  revs.forEach(r=>{ const idx=etapaIdx(r.etapa); if(idx==null||idx>7) return; for(let k=1;k<=idx;k++){ reached[k].total++; reached[k][r.statusVivensis]++; } });
  return {mat, reached};
}
function tempoMedio(revs, campoA, campoB, status){
  let n=0,s=0;
  revs.forEach(r=>{ if(status && r.statusVivensis!==status) return; const a=parseD(r[campoA]), b=parseD(r[campoB]); if(a&&b){ s+=daysBetween(b,a); n++; } });
  return n? s/n : null;
}
function ativacoesMedias(revs, cred){
  const sel=revs.filter(r=>isAtiva(r) && (cred? isCred(r) : !isCred(r)));
  if(!sel.length) return null;
  return sel.reduce((s,r)=>s+(+r.ativacoesMes||0),0)/sel.length;
}

/* por responsável */
function porResponsavel(ufFilter){
  return RESPS.map(resp=>{
    const revs=state.revendas.filter(r=>respOf(r)===resp).filter(r=>!ufFilter||ufFilter==="Todos"||r.uf===ufFilter);
    return {
      resp,
      total:revs.length,
      emProspeccao:revs.filter(r=>!isPerdida(r) && !isAtiva(r)).length,
      ativas:revs.filter(isAtiva).length,
      credenciadas:revs.filter(isCred).length,
      ativacoes:revs.reduce((s,r)=>s+(+r.ativacoesMes||0),0),
      perdidas:revs.filter(isPerdida).length
    };
  });
}

function tile(lab,cls,val,ctx,frac){
  return `<div class="tile ${cls==='good'?'good':''}"><div class="lab">${lab}</div><div class="val tnum">${val}</div>
    <div class="bar"><i style="width:${Math.max(2,Math.min(100,(frac||0)*100)).toFixed(1)}%"></i></div>
    <div class="ctx">${ctx}</div></div>`;
}
function tileNum(lab,val,ctx){
  return `<div class="tile"><div class="lab">${lab}</div><div class="val tnum">${fmtNum(val)}</div><div class="ctx">${ctx}</div></div>`;
}
function barrow(lab,val,max,amt){
  const w=Math.max(2,(val/ (max||1))*100);
  return `<div class="barrow"><div class="lab" title="${esc(lab)}">${esc(lab)}</div>
    <div class="track"><i style="width:${w.toFixed(1)}%" title="${esc(lab)}: ${esc(amt)}"></i></div><div class="amt tnum">${esc(amt)}</div></div>`;
}
function oportunidades(uf){
  return cobertura(uf).filter(c=>c.prioridade===1 && c.credenciadas===0)
    .sort((a,b)=>b.vendas-a.vendas);
}

function statusPill(s){

}
function pill(cls,txt){ return `<span class="pill ${cls}">${esc(txt)}</span>`; }

/* ---------- Funil --------------------------------------------------------- */
function viewFunil(c){
  const f=filterState.funil||(filterState.funil={uf:"Todos",resp:"Todos"});
  const bar=el(`<div class="filters">
    ${sel("UF",["Todos",...UFS],f.uf,null,"uf")}
    ${sel("Responsável",["Todos",...RESPS],f.resp,null,"resp")}
  </div>`);
  bar.querySelectorAll("[data-k]").forEach(inp=>inp.addEventListener("input",()=>{f[inp.dataset.k]=inp.value;render();}));
  c.appendChild(bar);

  const revs=filtra(state.revendas,f);
  const fu=funil(revs);
  const stages=ETAPAS.filter(e=>e!=="Perdida/Descartada");
  const maxReached=Math.max(1,...stages.map((e,i)=>fu.reached[i+1].total));

  // funil + conversão
  const fc=el(`<div class="card"><div class="hd"><h3>Funil — quantas revendas atingiram cada etapa</h3>
    <span class="hint">${revs.length} revenda(s) no filtro</span></div><div class="bd"><div class="funnel" id="funbars"></div></div></div>`);
  const fb=fc.querySelector("#funbars");
  stages.forEach((e,i)=>{
    const k=i+1, reached=fu.reached[k].total, atual=fu.mat[e].total;
    fb.appendChild(el(barrow(`${k}. ${e}`,reached,maxReached,`${reached}`)));
    if(i<stages.length-1){
      const nx=fu.reached[k+1].total, conv=reached? nx/reached : 0;
      fb.appendChild(el(`<div class="convrow">↳ conversão p/ <b>${esc(stages[i+1])}</b>: <b>${fmtPct(conv)}</b> <span class="hint">(${atual} hoje nesta etapa)</span></div>`));
    }
  });
  c.appendChild(fc);

  // conversão por status
  const conv=el(`<div class="card" style="margin-top:16px"><div class="hd"><h3>Conversão entre etapas por status Vivensis</h3></div>
    <div class="bd"><div class="tablewrap" style="border:0"><table><thead><tr><th>Transição</th>
      ${STATUS_VIV.map(s=>`<th class="num">${s}</th>`).join("")}<th class="num">Geral</th></tr></thead><tbody>
      ${stages.slice(0,-1).map((e,i)=>{ const k=i+1;
        const cells=STATUS_VIV.map(s=>{ const den=fu.reached[k][s], num=fu.reached[k+1][s]; return `<td class="num">${den?fmtPct(num/den):"—"}</td>`; }).join("");
        const den=fu.reached[k].total,num=fu.reached[k+1].total;
        return `<tr><td>${esc(e)} → ${esc(stages[i+1])}</td>${cells}<td class="num">${den?fmtPct(num/den):"—"}</td></tr>`;
      }).join("")}
    </tbody></table></div></div></div>`);
  c.appendChild(conv);

  // tempos + vivensis compare
  const grid=el(`<div class="grid kgrid" style="margin-top:16px"></div>`);
  const temp=el(`<div class="card"><div class="hd"><h3>Tempo médio (dias) por status</h3></div><div class="bd">
    <div class="tablewrap" style="border:0"><table><thead><tr><th>Intervalo</th>${STATUS_VIV.map(s=>`<th class="num">${s==="Sem credenciamento"?"Sem":s==="Em credenciamento"?"Em cred.":"Credenc."}</th>`).join("")}<th class="num">Geral</th></tr></thead><tbody>
    ${[["Lead → Cadastro","dataLead","dataCadastro"],["Cadastro → Credenciamento","dataCadastro","dataCred"],["Cadastro → 1ª venda","dataCadastro","data1Venda"]]
      .map(([lab,a,b])=>`<tr><td>${lab}</td>${STATUS_VIV.map(s=>{const t=tempoMedio(revs,a,b,s);return `<td class="num">${t==null?"—":t.toFixed(0)}</td>`;}).join("")}<td class="num">${(()=>{const t=tempoMedio(revs,a,b,null);return t==null?"—":t.toFixed(0);})()}</td></tr>`).join("")}
    </tbody></table></div></div></div>`);
  grid.appendChild(temp);

  const am=ativacoesMedias(revs,false), ac=ativacoesMedias(revs,true);
  const nAtivaCred=revs.filter(r=>isAtiva(r)&&isCred(r)).length, nAtivaSem=revs.filter(r=>isAtiva(r)&&!isCred(r)).length;
  const cmp=el(`<div class="card"><div class="hd"><h3>Com × sem Vivensis — ativações médias por revenda ativa</h3></div><div class="bd">
    <div class="cmp">
      <div class="box"><div class="k"><i style="background:var(--s1)"></i>Com Vivensis</div><div class="v tnum">${ac==null?"—":ac.toFixed(1).replace(".",",")}</div><div class="d">${nAtivaCred} revenda(s) ativa(s) credenciada(s)</div></div>
      <div class="box"><div class="k"><i style="background:var(--s6)"></i>Sem Vivensis</div><div class="v tnum">${am==null?"—":am.toFixed(1).replace(".",",")}</div><div class="d">${nAtivaSem} revenda(s) ativa(s) sem credenciamento</div></div>
    </div>
    <div class="hint" style="margin-top:10px">Ativações/mês médias. Compare o retorno do canal credenciado Vivensis com o não credenciado.</div>
  </div></div>`);
  grid.appendChild(cmp);
  c.appendChild(grid);
}

      <label class="fld"><span>Motivo de perda</span>${selRaw("motivo",["",...MOTIVOS],r.motivo,true)}</label>
      <label class="fld"><span>Última atualização</span><input type="date" data-f="ultAtualizacao" value="${r.ultAtualizacao||""}"></label>
      <label class="fld full"><span>Observações</span><textarea data-f="obs" rows="2">${esc(r.obs)}</textarea></label>
    </div>
    <div class="mf">
      <div>${id?`<button class="btn ghost sm" id="delrev" style="color:var(--crit);border-color:transparent">Excluir revenda</button>`:""}</div>
      <div style="display:flex;gap:10px"><button class="btn" id="cancelm">Cancelar</button><button class="btn primary" id="savem">Salvar</button></div>
    </div></div>`);
  scrim.appendChild(m);
  scrim.appendChild(el(`<datalist id="munlist">${state.mercado.map(mm=>`<option value="${esc(mm.municipio)}"></option>`).join("")}</datalist>`));
  scrim.classList.add("open");
  const close=()=>{ scrim.classList.remove("open"); editingId=null; };
  m.querySelector("#closem").addEventListener("click",close);
  m.querySelector("#cancelm").addEventListener("click",close);
  const del=m.querySelector("#delrev"); if(del) del.addEventListener("click",()=>{
    if(confirm("Excluir esta revenda? Esta ação não pode ser desfeita.")){ state.revendas=state.revendas.filter(x=>x.id!==id); save(); close(); render(); toast("Revenda excluída."); }
  });
  m.querySelector("#savem").addEventListener("click",()=>{
    const data={};
    m.querySelectorAll("[data-f]").forEach(inp=>{ data[inp.dataset.f]=inp.value; });
    if(!data.nome.trim()){ toast("Informe o nome da revenda."); return; }
    if(!data.municipio.trim()){ toast("Informe o município."); return; }
    data.ativacoesMes=+data.ativacoesMes||0; data.ativacoesAcum=+data.ativacoesAcum||0;
    if(id){ Object.assign(state.revendas.find(x=>x.id===id), data); }
    else { data.id=nextId(); state.revendas.push(data); }
    save(); close(); render(); toast(id?"Revenda atualizada.":"Revenda adicionada.");
  });
}
function blankRevenda(){
  return {id:"",nome:"",cnpj:"",contato:"",telefone:"",email:"",municipio:"",uf:"PA",canal:"Telecom",origem:"Prospecção ativa",
    etapa:"Lead identificado",statusVivensis:"Sem credenciamento",respOverride:"",dataLead:isoToday(),data1Contato:"",dataApresentacao:"",
    dataInteresse:"",dataCadastro:"",dataInicioCred:"",dataCred:"",data1Venda:"",ativacoesMes:0,ativacoesAcum:0,dataUltimaVenda:"",
    motivo:"",obs:"",ultAtualizacao:isoToday()};
}
function nextId(){ let n=0; state.revendas.forEach(r=>{ const mm=/REV-(\d+)/.exec(r.id||""); if(mm) n=Math.max(n,+mm[1]); }); return "REV-"+String(n+1).padStart(3,"0"); }
function isoToday(){ const d=today(); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }

/* ============================ SELECTS ==================================== */
function sel(lab,opts,val,_,key,cls,isText){
  if(isText){ return `<label class="fld ${cls||""}"><span>${lab}</span><input type="text" data-k="${key}" value="${esc(val||"")}" placeholder="nome, município, CNPJ…"></label>`; }
  return `<label class="fld ${cls||""}"><span>${lab}</span><select data-k="${key}">${opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
}
function selRaw(key,opts,val,allowEmpty){
  return `<select data-f="${key}">${opts.map(o=>`<option value="${esc(o)}" ${o===val?"selected":""}>${o===""?(allowEmpty?"— (território/none) —":""):esc(o)}</option>`).join("")}</select>`;
}

/* ============================ GRÁFICO DE LINHAS ========================== */
function drawEvolution(host){
  if(!host) return;
  const rows=state.historico.filter(h=>h.uf==="Todos").slice();
  host.innerHTML="";
  if(rows.length<1){ host.appendChild(el(`<div class="empty">Sem registros ainda. Use “Registrar semana”.</div>`)); return; }
  const W=host.clientWidth||680, H=220, pad={l:44,r:16,t:14,b:28};
  const xs=rows.map((_,i)=>i), n=rows.length;
  const X=i=> n<=1? pad.l+(W-pad.l-pad.r)/2 : pad.l + (i/(n-1))*(W-pad.l-pad.r);
  const Y=v=> pad.t + (1-v)*(H-pad.t-pad.b);
  const cs=getComputedStyle(document.documentElement);
  const grid=cs.getPropertyValue("--grid"), axis=cs.getPropertyValue("--axis"), muted=cs.getPropertyValue("--muted");
  const s1=cs.getPropertyValue("--s1"), s2=cs.getPropertyValue("--s2");
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Evolução da cobertura P1">`;
  // gridlines y (0,25,50,75,100%)
  [0,.25,.5,.75,1].forEach(v=>{ const y=Y(v); svg+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="${grid}" stroke-width="1"/>`;
    svg+=`<text x="${pad.l-8}" y="${y+3}" text-anchor="end" font-size="10" fill="${muted}">${(v*100).toFixed(0)}%</text>`; });
  // x labels
  rows.forEach((r,i)=>{ const d=parseD(r.data); const lab=d?`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`:""; svg+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="${muted}">${lab}</text>`; });
  svg+=`<line x1="${pad.l}" y1="${Y(0)}" x2="${W-pad.r}" y2="${Y(0)}" stroke="${axis}" stroke-width="1.5"/>`;
  const line=(key,color)=>{
    let p=""; rows.forEach((r,i)=>{ p+=(i?"L":"M")+X(i)+" "+Y(r[key]||0); });
    let s=`<path d="${p}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    rows.forEach((r,i)=>{ s+=`<circle cx="${X(i)}" cy="${Y(r[key]||0)}" r="3.5" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    // endpoint label
    const li=rows.length-1; s+=`<text x="${X(li)}" y="${Y(rows[li][key]||0)-8}" text-anchor="end" font-size="11" font-weight="700" fill="${color}">${fmtPct(rows[li][key])}</text>`;
    return s;
  };
  svg+=line("cobP1",s1)+line("cobP1cred",s2);
  // hover layer
  rows.forEach((r,i)=>{ svg+=`<rect x="${X(i)-14}" y="${pad.t}" width="28" height="${H-pad.t-pad.b}" fill="transparent" data-i="${i}"/>`; });
  svg+=`</svg>`;
  host.innerHTML=svg;
  const svgEl=host.querySelector("svg"), tip=document.getElementById("tip");
  svgEl.querySelectorAll("[data-i]").forEach(rect=>{
    rect.addEventListener("mousemove",ev=>{
      const r=rows[+rect.dataset.i];
      tip.innerHTML=`<div style="font-weight:700;margin-bottom:3px">${fmtD(r.data)}</div>
        <div class="tt-row"><i style="background:var(--s1)"></i>Cobertura P1: <b>${fmtPct(r.cobP1)}</b></div>
        <div class="tt-row"><i style="background:var(--s2)"></i>P1 credenciada: <b>${fmtPct(r.cobP1cred)}</b></div>`;
      tip.style.left=(ev.clientX+14)+"px"; tip.style.top=(ev.clientY+14)+"px"; tip.style.opacity="1";
    });
    rect.addEventListener("mouseleave",()=>tip.style.opacity="0");
  });
}

/* ============================ AÇÕES ===================================== */
function registrarSemana(){
  const k=kpisCobertura("Todos");
  const ativasSemViv=state.revendas.filter(r=>isAtiva(r)&&!isCred(r)).length;
  const credenciadas=state.revendas.filter(isCred).length;
  const prospeccao=state.revendas.filter(r=>!isPerdida(r)).length;
  const ativacoes=state.revendas.filter(isAtiva).reduce((s,r)=>s+(+r.ativacoesMes||0),0);
  const snap={data:isoToday(),uf:"Todos",cobP1:+k.cobP1.toFixed(4),cobP1cred:+k.cobP1cred.toFixed(4),prospeccao,ativasSemViv,credenciadas,ativacoes};
  const i=state.historico.findIndex(h=>h.data===snap.data && h.uf==="Todos");
  if(i>=0) state.historico[i]=snap; else state.historico.push(snap);
  state.historico.sort((a,b)=>a.data<b.data?-1:1);
  save(); render(); toast("Semana registrada no histórico.");
}
function exportCSV(){
  const f=filterState.revendas||{};
  const rows=filtra(state.revendas,f);
  const cols=["id","nome","cnpj","contato","telefone","email","municipio","uf","canal","origem","etapa","statusVivensis"];
  const extra=["Responsável","Região","Prioridade","Dias na etapa","Ativa","Ativações mês","Última venda"];
  const head=[...cols,...extra];
  const body=rows.map(r=>[...cols.map(c=>r[c]),respOf(r),regiaoOf(r.municipio,r.uf)||"",prioridadeOf(r.municipio,r.uf)||"",
    diasNaEtapa(r)??"",isAtiva(r)?"Sim":"Não",r.ativacoesMes||0,fmtD(r.dataUltimaVenda)]
    .map(v=>{ v=String(v==null?"":v); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(";"));
  const csv="﻿"+[head.join(";"),...body].join("\r\n");
  download("revendas_starlink.csv",csv,"text/csv");
}
function backupJSON(){ download("backup_painel_starlink.json",JSON.stringify(state,null,2),"application/json"); }
function restoreJSON(){
  const inp=el(`<input type="file" accept="application/json" style="display:none">`); document.body.appendChild(inp);
  inp.addEventListener("change",()=>{ const file=inp.files[0]; if(!file){inp.remove();return;}
    const rd=new FileReader(); rd.onload=()=>{ try{ const s=JSON.parse(rd.result); state=Object.assign(defaults(),s); save(); render(); toast("Backup restaurado."); }catch(e){ toast("Arquivo inválido."); } inp.remove(); };
    rd.readAsText(file);
  }); inp.click();
}
function resetSeed(){ if(confirm("Restaurar os dados de exemplo? Isto substitui tudo que está salvo.")){ state=defaults(); save(); render(); toast("Dados de exemplo restaurados."); } }
function download(name,content,type){
  const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* menu backup */
function openMenu(){
  const scrim=document.getElementById("scrim"); scrim.innerHTML="";
  const m=el(`<div class="modal" style="width:min(460px,100%)" role="dialog" aria-modal="true" aria-label="Dados e backup">
    <div class="mh"><h3>Dados e backup</h3><button class="iconbtn" id="closem" aria-label="Fechar">✕</button></div>
    <div class="mb" style="grid-template-columns:1fr">
      <button class="btn" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg>Baixar backup (JSON)</button>
      <button class="btn" id="rs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21V9m0 0 4 4m-4-4-4 4M4 3h16"/></svg>Restaurar backup (JSON)</button>
      <button class="btn" id="csv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>Exportar revendas (CSV)</button>
      <button class="btn ghost" id="seed" style="color:var(--crit);border-color:transparent">Restaurar dados de exemplo</button>
      <div class="hint">Os dados ficam salvos só neste navegador/dispositivo. Baixe um backup JSON com frequência — é o seu arquivo-mestre, como era a planilha.</div>
    </div></div>`);
  scrim.appendChild(m); scrim.classList.add("open");
  const close=()=>scrim.classList.remove("open");
  m.querySelector("#closem").addEventListener("click",close);
  m.querySelector("#bk").addEventListener("click",()=>{backupJSON();});
  m.querySelector("#rs").addEventListener("click",()=>{close();restoreJSON();});
  m.querySelector("#csv").addEventListener("click",()=>{exportCSV();});
  m.querySelector("#seed").addEventListener("click",()=>{close();resetSeed();});
}

/* ============================ TEMA / TOAST ============================== */
function prefersDark(){ return typeof matchMedia==="function" && matchMedia("(prefers-color-scheme: dark)").matches; }
function applyTheme(){
  const t=state.theme; const root=document.documentElement;
  if(t==="dark"||t==="light") root.setAttribute("data-theme",t); else root.removeAttribute("data-theme");
  const dark = t==="dark" || (t==null && prefersDark());
  document.getElementById("themebtn").innerHTML = dark
    ? '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>'
    : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
}
function toggleTheme(){
  const dark = state.theme==="dark" || (state.theme==null && prefersDark());
  state.theme = dark? "light":"dark"; save(); applyTheme(); if(current==='geral'||current==='dados') render();
}
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

/* ============================ EVENTOS GLOBAIS =========================== */
document.getElementById("nav").addEventListener("click",e=>{ const b=e.target.closest("[data-view]"); if(b){ current=b.dataset.view; render(); window.scrollTo(0,0);} });
document.getElementById("addrev").addEventListener("click",()=>openForm(null));
document.getElementById("themebtn").addEventListener("click",toggleTheme);
document.getElementById("menubtn").addEventListener("click",openMenu);
document.getElementById("scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") e.currentTarget.classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.getElementById("scrim").classList.remove("open"); });
if(typeof matchMedia==="function"){ try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(state.theme==null){ applyTheme(); render(); } }); }catch(e){} }
window.addEventListener("resize",()=>{ if(current==="geral"||current==="dados"){ const h=document.getElementById("evochart")||document.getElementById("histchart"); if(h) drawEvolution(h);} });

/* ============================ INÍCIO ==================================== */
applyTheme();
render();
</script>
