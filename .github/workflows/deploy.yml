name: Deploy — Cloudflare Worker

# Faz deploy da Plataforma de Prospeccao Starlink (cloudflare/) a cada push na main.
# Requer o secret CLOUDFLARE_API_TOKEN no repositorio (Settings > Secrets > Actions).
# O account_id ja esta em cloudflare/wrangler.jsonc.
# Redeploy manual solicitado em 2026-11-12 (mapa: heatmap quente + drill-down por estado).

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Cache-busting: estampa uma versao nova em app.js/styles.css para o navegador
      # sempre baixar a versao recem-publicada (vale para deploys feitos direto pelo push).
      - name: Cache-busting (estampar versao dos assets)
        run: |
          ver=$(date +%Y%m%d%H%M)
          sed -i -E "s#(/static/(app\.js|styles\.css))\?v=[^\"]*#\1?v=$ver#g" public/index.html
          echo "Versao dos assets: $ver"

      - name: Aplicar migrations no D1 (remoto)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: d1 migrations apply prospeccao-starlink --remote

      - name: Deploy do Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: deploy
