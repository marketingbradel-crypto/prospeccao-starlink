name: Deploy — Cloudflare Worker

# Faz deploy da Plataforma de Prospeccao Starlink (cloudflare/) a cada push na main.
# Requer o secret CLOUDFLARE_API_TOKEN no repositorio (Settings > Secrets > Actions).
# O account_id ja esta em cloudflare/wrangler.jsonc.

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migrations no D1 (remoto)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: d1 migrations apply prospeccao-starlink --remote

      - name: Deploy do Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: deploy
